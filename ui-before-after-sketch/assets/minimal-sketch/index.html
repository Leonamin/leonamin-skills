<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UI Before/After Sketch</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="sketch-document">
      <section class="sketch-panel" aria-labelledby="before-label">
        <h1 id="before-label" class="sketch-label">BEFORE</h1>
        <!-- Copy only this ui-surface into an implementation, after replacing it with verified product UI. -->
        <div class="ui-surface"></div>
      </section>

      <aside class="sketch-annotation" data-sketch-only="true">
        <strong>SKETCH NOTE · NOT FOR IMPLEMENTATION</strong>
        <p>Document the verified problem outside the product UI.</p>
      </aside>

      <section class="sketch-panel" aria-labelledby="after-label">
        <h1 id="after-label" class="sketch-label">AFTER</h1>
        <!-- Copy only this ui-surface into an implementation, after replacing it with verified product UI. -->
        <div class="ui-surface"></div>
      </section>
    </main>
  </body>
</html>
